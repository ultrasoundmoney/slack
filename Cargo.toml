[package]
name = "slack"
version = "0.1.0"
edition = "2024"
description = "Small Slack bot message client and safe operational message builders"
license = "MIT"
repository = "https://github.com/ultrasoundmoney/slack"
publish = false

[features]
default = ["async"]
async = ["dep:reqwest"]
blocking = ["dep:ureq"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"], optional = true }
ureq = { version = "3.3", features = ["json"], optional = true }

[dev-dependencies]
proptest = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
wiremock = "0.6"
tracing-subscriber = { version = "0.3", features = ["fmt"] }

[[example]]
name = "async"
required-features = ["async"]

[[example]]
name = "blocking"
required-features = ["blocking"]
